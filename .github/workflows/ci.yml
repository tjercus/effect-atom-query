name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # format, lint, type check, tests, builds, bundle-size budget
      - run: vp run ready
      # pack every package and check what would be published (nothing is uploaded)
      - run: vp run release:check
